<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2C5F3E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TripReport" />
    <link rel="manifest" href="/manifest.json" />
    <title>TripReport</title>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #F5F4F0;
      }
      #app-splash img {
        width: 128px;
        height: 128px;
        border-radius: 28px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      }
      #app-splash span {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-size: 22px;
        font-weight: 800;
        color: #2A2825;
        letter-spacing: -0.4px;
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <img src="/splash-logo.png" width="128" height="128" alt="" />
      <span>TripReport</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module">
      // Registered as early as possible so a first online visit finishes
      // precaching the whole app — that is what makes it launch without service.
      if (import.meta.env.PROD && !window.Capacitor?.isNativePlatform?.() && 'serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            // A new deploy installs in the background; take it over on next load.
            reg.addEventListener('updatefound', () => {
              const incoming = reg.installing;
              if (!incoming) return;
              incoming.addEventListener('statechange', () => {
                if (incoming.state === 'installed' && navigator.serviceWorker.controller) {
                  window.dispatchEvent(new CustomEvent('tr-update-ready'));
                }
              });
            });
          }).catch(() => {
            // Registration failure must not break the app.
          });
        });
      } else if (import.meta.env.DEV && 'serviceWorker' in navigator) {
        // A production preview may have installed our worker on this origin.
        // It must not cache Vite's client or its per-process WebSocket token.
        const workerUrl = new URL('/sw.js', window.location.origin).href;
        const controlledByTripReport = navigator.serviceWorker.controller?.scriptURL === workerUrl;
        navigator.serviceWorker.getRegistrations().then(async (registrations) => {
          const owned = registrations.filter((reg) =>
            [reg.active, reg.waiting, reg.installing].some((worker) => worker?.scriptURL === workerUrl),
          );
          const removed = await Promise.all(owned.map((reg) => reg.unregister()));
          // Unregistering leaves the current page controlled until navigation.
          if (controlledByTripReport && removed.some(Boolean)) window.location.reload();
        }).catch((error) => console.warn('Could not remove the local offline worker', error));
      }
    </script>
  </body>
</html>
